name: ai-service-request-end-to-end-check

x-n8n-environment: &n8n-environment
  N8N_ENCRYPTION_KEY: ${AI_AUTOMATION_E2E_N8N_ENCRYPTION_KEY:?The E2E runner must provide a temporary n8n encryption key}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_RUNNERS_TASK_TIMEOUT: "60"
  N8N_LOG_LEVEL: warn
  N8N_HOST: n8n
  N8N_PORT: "5678"
  N8N_PROTOCOL: http
  N8N_SECURE_COOKIE: "false"
  N8N_WEBHOOK_URL: http://n8n:5678/

services:
  primary-database:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ai_service_request_test
      POSTGRES_USER: service_request_test
      POSTGRES_PASSWORD: ${AI_AUTOMATION_E2E_PRIMARY_DB_PASSWORD:?The E2E runner must provide a temporary primary database password}
    healthcheck:
      test: [CMD-SHELL, 'test "$$(cat /proc/1/comm)" = "postgres" && pg_isready -U service_request_test -d ai_service_request_test']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./sql/migrations/001_identity_and_reference.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
      - ./sql/seeds/001_fictional_identity_and_reference.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./sql/migrations/002_case_foundation.sql:/docker-entrypoint-initdb.d/03-migration.sql:ro
      - ./sql/seeds/002_fictional_cases.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
      - ./sql/migrations/003_ai_and_decisions.sql:/docker-entrypoint-initdb.d/05-migration.sql:ro
      - ./sql/migrations/004_policy_retrieval.sql:/docker-entrypoint-initdb.d/06-migration.sql:ro
      - ./sql/seeds/003_policy_database_fixtures.sql:/docker-entrypoint-initdb.d/07-seed.sql:ro
      - ./sql/migrations/005_reliable_delivery.sql:/docker-entrypoint-initdb.d/08-migration.sql:ro
      - ./sql/migrations/006_intake_execution.sql:/docker-entrypoint-initdb.d/09-migration.sql:ro
      - ./sql/migrations/007_ai_analysis_runtime.sql:/docker-entrypoint-initdb.d/10-migration.sql:ro
      - ./sql/migrations/008_human_decision_resume.sql:/docker-entrypoint-initdb.d/11-migration.sql:ro
    restart: "no"

  sandbox-database:
    image: postgres:17.11
    environment:
      POSTGRES_DB: service_desk_test
      POSTGRES_USER: service_desk_test
      POSTGRES_PASSWORD: ${AI_AUTOMATION_E2E_SANDBOX_DB_PASSWORD:?The E2E runner must provide a temporary sandbox database password}
    healthcheck:
      test: [CMD-SHELL, 'test "$$(cat /proc/1/comm)" = "postgres" && pg_isready -U service_desk_test -d service_desk_test']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./sandbox/migrations/001_service_records.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
      - ./sandbox/migrations/002_reference_scale.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
    restart: "no"

  primary-api:
    image: ai-service-request-end-to-end-check-primary:local
    build:
      context: ./application
    depends_on:
      primary-database: {condition: service_healthy}
    command: [uvicorn, main:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      AI_ANALYSIS_FIXTURE_FILE: /fixtures/e2e_ai_fixture.json
      AI_ANALYSIS_PROVIDER: fixture
      APP_SESSION_SECRET: ${AI_AUTOMATION_E2E_SESSION_SECRET:?The E2E runner must provide a temporary session secret}
      INTAKE_WEBHOOK_TOKEN: ${AI_AUTOMATION_E2E_INTAKE_TOKEN:?The E2E runner must provide a temporary intake token}
      PRIMARY_DATABASE_URL: postgresql://service_request_test:${AI_AUTOMATION_E2E_PRIMARY_DB_PASSWORD}@primary-database:5432/ai_service_request_test
      PRIMARY_WORKFLOW_TOKEN: ${AI_AUTOMATION_E2E_PRIMARY_TOKEN:?The E2E runner must provide a temporary primary token}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./application/tests/fixtures/e2e_ai_fixture.json:/fixtures/e2e_ai_fixture.json:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  sandbox-api:
    image: ai-service-request-end-to-end-check-sandbox:local
    build:
      context: ./sandbox
    depends_on:
      sandbox-database: {condition: service_healthy}
    environment:
      SERVICE_DESK_SANDBOX_DATABASE_URL: postgresql://service_desk_test:${AI_AUTOMATION_E2E_SANDBOX_DB_PASSWORD}@sandbox-database:5432/service_desk_test
      SERVICE_DESK_SANDBOX_TEST_MODE: "true"
      SERVICE_DESK_SANDBOX_TOKEN: ${AI_AUTOMATION_E2E_SANDBOX_TOKEN:?The E2E runner must provide a temporary sandbox token}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  n8n-setup:
    image: docker.n8n.io/n8nio/n8n:2.33.2
    environment:
      <<: *n8n-environment
      N8N_WORKFLOW_START_TOKEN: ${AI_AUTOMATION_E2E_N8N_TOKEN:?The E2E runner must provide a temporary n8n token}
      PRIMARY_WORKFLOW_TOKEN: ${AI_AUTOMATION_E2E_PRIMARY_TOKEN:?The E2E runner must provide a temporary primary token}
    entrypoint: [/bin/sh]
    command: [/setup/setup-end-to-end.sh]
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/setup:ro
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.2
    depends_on:
      n8n-setup: {condition: service_completed_successfully}
      primary-api: {condition: service_healthy}
    environment: *n8n-environment
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - n8n-data:/home/node/.n8n
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  tests:
    image: ai-service-request-end-to-end-check-primary:local
    depends_on:
      n8n: {condition: service_healthy}
      primary-api: {condition: service_healthy}
      sandbox-api: {condition: service_healthy}
    command: [python, /checks/test_end_to_end_integration.py]
    environment:
      APP_SESSION_SECRET: ${AI_AUTOMATION_E2E_SESSION_SECRET:?The E2E runner must provide a temporary session secret}
      E2E_FIXTURE_FILE: /fixtures/e2e_ai_fixture.json
      INTAKE_WEBHOOK_TOKEN: ${AI_AUTOMATION_E2E_INTAKE_TOKEN:?The E2E runner must provide a temporary intake token}
      N8N_HUMAN_RESUME_URL: http://n8n:5678/webhook/service-request-human-resume-v1
      N8N_TOKEN: ${AI_AUTOMATION_E2E_N8N_TOKEN:?The E2E runner must provide a temporary n8n token}
      N8N_WORKFLOW_START_URL: http://n8n:5678/webhook/service-request-intake-v1
      PRIMARY_API_URL: http://primary-api:8000
      PRIMARY_DATABASE_URL: postgresql://service_request_test:${AI_AUTOMATION_E2E_PRIMARY_DB_PASSWORD}@primary-database:5432/ai_service_request_test
      PRIMARY_WORKFLOW_TOKEN: ${AI_AUTOMATION_E2E_PRIMARY_TOKEN:?The E2E runner must provide a temporary primary token}
      PYTHONPATH: /app
      SERVICE_DESK_SANDBOX_DATABASE_URL: postgresql://service_desk_test:${AI_AUTOMATION_E2E_SANDBOX_DB_PASSWORD}@sandbox-database:5432/service_desk_test
      SERVICE_DESK_SANDBOX_TOKEN: ${AI_AUTOMATION_E2E_SANDBOX_TOKEN:?The E2E runner must provide a temporary sandbox token}
      SERVICE_DESK_SANDBOX_URL: http://sandbox-api:8000
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./application/tests/test_end_to_end_integration.py:/checks/test_end_to_end_integration.py:ro
      - ./application/tests/fixtures/e2e_ai_fixture.json:/fixtures/e2e_ai_fixture.json:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

volumes:
  n8n-data:
