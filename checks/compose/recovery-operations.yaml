name: ai-service-request-recovery-operations-check

x-n8n-environment: &n8n-environment
  N8N_ENCRYPTION_KEY: ${AI_AUTOMATION_RECOVERY_N8N_ENCRYPTION_KEY:?The recovery runner must provide a temporary n8n encryption key}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
  N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_RUNNERS_TASK_TIMEOUT: "60"
  N8N_LOG_LEVEL: warn
  N8N_HOST: n8n
  N8N_PORT: "5678"
  N8N_PROTOCOL: http
  N8N_SECURE_COOKIE: "false"
  N8N_WEBHOOK_URL: http://n8n:5678/

services:
  database:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ai_service_request_test
      POSTGRES_USER: service_request_test
      POSTGRES_PASSWORD: ${AI_AUTOMATION_RECOVERY_DB_PASSWORD:?The recovery runner must provide a temporary database password}
    healthcheck:
      test: [CMD-SHELL, 'test "$$(cat /proc/1/comm)" = "postgres" && pg_isready -U service_request_test -d ai_service_request_test']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./sql/migrations/001_identity_and_reference.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
      - ./sql/seeds/001_fictional_identity_and_reference.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./sql/migrations/002_case_foundation.sql:/docker-entrypoint-initdb.d/03-migration.sql:ro
      - ./sql/migrations/003_ai_and_decisions.sql:/docker-entrypoint-initdb.d/04-migration.sql:ro
      - ./sql/migrations/004_policy_retrieval.sql:/docker-entrypoint-initdb.d/05-migration.sql:ro
      - ./sql/migrations/005_reliable_delivery.sql:/docker-entrypoint-initdb.d/06-migration.sql:ro
      - ./sql/migrations/006_intake_execution.sql:/docker-entrypoint-initdb.d/07-migration.sql:ro
      - ./sql/migrations/007_ai_analysis_runtime.sql:/docker-entrypoint-initdb.d/08-migration.sql:ro
      - ./sql/migrations/008_human_decision_resume.sql:/docker-entrypoint-initdb.d/09-migration.sql:ro
    restart: "no"

  primary-api:
    image: ai-service-request-recovery-operations-check-application:local
    build:
      context: ./application
    depends_on:
      database: {condition: service_healthy}
    command: [uvicorn, main:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      APP_SESSION_SECRET: ${AI_AUTOMATION_RECOVERY_SESSION_SECRET:?The recovery runner must provide a temporary session secret}
      INTAKE_WEBHOOK_TOKEN: ${AI_AUTOMATION_RECOVERY_INTAKE_TOKEN:?The recovery runner must provide a temporary intake token}
      PRIMARY_DATABASE_URL: postgresql://service_request_test:${AI_AUTOMATION_RECOVERY_DB_PASSWORD}@database:5432/ai_service_request_test
      PRIMARY_WORKFLOW_TOKEN: ${AI_AUTOMATION_RECOVERY_PRIMARY_TOKEN:?The recovery runner must provide a temporary primary token}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  n8n-setup:
    image: docker.n8n.io/n8nio/n8n:2.33.2
    environment:
      <<: *n8n-environment
      N8N_WORKFLOW_START_TOKEN: ${AI_AUTOMATION_RECOVERY_N8N_TOKEN:?The recovery runner must provide a temporary n8n token}
      PRIMARY_WORKFLOW_TOKEN: ${AI_AUTOMATION_RECOVERY_PRIMARY_TOKEN:?The recovery runner must provide a temporary primary token}
    entrypoint: [/bin/sh]
    command: [/setup/setup-recovery.sh]
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/setup:ro
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.2
    depends_on:
      n8n-setup: {condition: service_completed_successfully}
      primary-api: {condition: service_healthy}
    environment: *n8n-environment
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [n8n-data:/home/node/.n8n]
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.cache:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  tests:
    image: ai-service-request-recovery-operations-check-application:local
    depends_on:
      n8n: {condition: service_healthy}
      primary-api: {condition: service_healthy}
    command: [python, /checks/test_recovery_operations_integration.py]
    environment:
      N8N_RECOVERY_TOKEN: ${AI_AUTOMATION_RECOVERY_N8N_TOKEN:?The recovery runner must provide a temporary n8n token}
      N8N_RECOVERY_URL: http://n8n:5678/webhook/service-request-recovery-v1
      PRIMARY_API_URL: http://primary-api:8000
      PRIMARY_DATABASE_URL: postgresql://service_request_test:${AI_AUTOMATION_RECOVERY_DB_PASSWORD}@database:5432/ai_service_request_test
      PRIMARY_WORKFLOW_TOKEN: ${AI_AUTOMATION_RECOVERY_PRIMARY_TOKEN:?The recovery runner must provide a temporary primary token}
      RECOVERY_WORKFLOW_FILE: /checks/recovery-v1.json
      PYTHONPATH: /app
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./application/tests/test_recovery_operations_integration.py:/checks/test_recovery_operations_integration.py:ro
      - ./n8n/recovery-v1.json:/checks/recovery-v1.json:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

volumes:
  n8n-data:
