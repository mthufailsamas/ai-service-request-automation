name: ai-service-request-sandbox-check

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: service_desk_sandbox_test
      POSTGRES_USER: service_desk_sandbox_test
      POSTGRES_PASSWORD: ${AI_AUTOMATION_SANDBOX_DB_PASSWORD:?The sandbox runner must provide a temporary database password}
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(cat /proc/1/comm)" = "postgres" && pg_isready -U service_desk_sandbox_test -d service_desk_sandbox_test
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./sandbox/migrations/001_service_records.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
    restart: "no"

  sandbox:
    build:
      context: ./sandbox
    depends_on:
      database:
        condition: service_healthy
    environment:
      SERVICE_DESK_SANDBOX_DATABASE_URL: postgresql://service_desk_sandbox_test:${AI_AUTOMATION_SANDBOX_DB_PASSWORD}@database:5432/service_desk_sandbox_test
      SERVICE_DESK_SANDBOX_TEST_MODE: "true"
      SERVICE_DESK_SANDBOX_TOKEN: ${AI_AUTOMATION_SANDBOX_TOKEN:?The sandbox runner must provide a temporary service token}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  tests:
    build:
      context: ./sandbox
    depends_on:
      sandbox:
        condition: service_healthy
    command:
      - python
      - /checks/test_contract.py
    environment:
      SERVICE_DESK_SANDBOX_BASE_URL: http://sandbox:8000
      SERVICE_DESK_SANDBOX_DATABASE_URL: postgresql://service_desk_sandbox_test:${AI_AUTOMATION_SANDBOX_DB_PASSWORD}@database:5432/service_desk_sandbox_test
      SERVICE_DESK_SANDBOX_TOKEN: ${AI_AUTOMATION_SANDBOX_TOKEN:?The sandbox runner must provide a temporary service token}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./sandbox/tests/test_contract.py:/checks/test_contract.py:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
