name: ai-service-request-ai-analysis-database-check

services:
  database:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ai_service_request_test
      POSTGRES_USER: service_request_test
      POSTGRES_PASSWORD: ${AI_AUTOMATION_ANALYSIS_DB_PASSWORD:?The AI-analysis runner must provide a temporary password}
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(cat /proc/1/comm)" = "postgres" && pg_isready -U service_request_test -d ai_service_request_test
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./sql/migrations/001_identity_and_reference.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
      - ./sql/seeds/001_fictional_identity_and_reference.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./sql/migrations/002_case_foundation.sql:/docker-entrypoint-initdb.d/03-migration.sql:ro
      - ./sql/seeds/002_fictional_cases.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
      - ./sql/migrations/003_ai_and_decisions.sql:/docker-entrypoint-initdb.d/05-migration.sql:ro
      - ./sql/migrations/004_policy_retrieval.sql:/docker-entrypoint-initdb.d/06-migration.sql:ro
      - ./sql/migrations/005_reliable_delivery.sql:/docker-entrypoint-initdb.d/07-migration.sql:ro
      - ./sql/migrations/006_intake_execution.sql:/docker-entrypoint-initdb.d/08-migration.sql:ro
      - ./sql/migrations/007_ai_analysis_runtime.sql:/docker-entrypoint-initdb.d/09-migration.sql:ro
    restart: "no"

  tests:
    image: postgres:17-alpine
    depends_on:
      database:
        condition: service_healthy
    command:
      - psql
      - --host=database
      - --username=service_request_test
      - --dbname=ai_service_request_test
      - --file=/checks/007_ai_analysis_runtime_test.sql
    environment:
      PGCONNECT_TIMEOUT: "5"
      PGPASSWORD: ${AI_AUTOMATION_ANALYSIS_DB_PASSWORD:?The AI-analysis runner must provide a temporary password}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./sql/tests/007_ai_analysis_runtime_test.sql:/checks/007_ai_analysis_runtime_test.sql:ro
    restart: "no"
