name: ai-service-request-delivery-check

services:
  primary-database:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ai_service_request_test
      POSTGRES_USER: service_request_test
      POSTGRES_PASSWORD: ${AI_AUTOMATION_DELIVERY_PRIMARY_DB_PASSWORD:?The delivery runner must provide a temporary primary database password}
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(cat /proc/1/comm)" = "postgres" && pg_isready -U service_request_test -d ai_service_request_test
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./sql/migrations/001_identity_and_reference.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
      - ./sql/seeds/001_fictional_identity_and_reference.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./sql/migrations/002_case_foundation.sql:/docker-entrypoint-initdb.d/03-migration.sql:ro
      - ./sql/seeds/002_fictional_cases.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
      - ./sql/migrations/003_ai_and_decisions.sql:/docker-entrypoint-initdb.d/05-migration.sql:ro
      - ./sql/migrations/004_policy_retrieval.sql:/docker-entrypoint-initdb.d/06-migration.sql:ro
      - ./sql/seeds/003_policy_database_fixtures.sql:/docker-entrypoint-initdb.d/07-seed.sql:ro
      - ./sql/migrations/005_reliable_delivery.sql:/docker-entrypoint-initdb.d/08-migration.sql:ro
    restart: "no"

  sandbox-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: service_desk_sandbox_test
      POSTGRES_USER: service_desk_sandbox_test
      POSTGRES_PASSWORD: ${AI_AUTOMATION_DELIVERY_SANDBOX_DB_PASSWORD:?The delivery runner must provide a temporary sandbox database password}
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(cat /proc/1/comm)" = "postgres" && pg_isready -U service_desk_sandbox_test -d service_desk_sandbox_test
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./sandbox/migrations/001_service_records.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
    restart: "no"

  sandbox:
    build:
      context: ./sandbox
    depends_on:
      sandbox-database:
        condition: service_healthy
    environment:
      SERVICE_DESK_SANDBOX_DATABASE_URL: postgresql://service_desk_sandbox_test:${AI_AUTOMATION_DELIVERY_SANDBOX_DB_PASSWORD}@sandbox-database:5432/service_desk_sandbox_test
      SERVICE_DESK_SANDBOX_TEST_MODE: "true"
      SERVICE_DESK_SANDBOX_TOKEN: ${AI_AUTOMATION_DELIVERY_SANDBOX_TOKEN:?The delivery runner must provide a temporary service token}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  tests:
    build:
      context: ./application
    depends_on:
      primary-database:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    command:
      - python
      - /checks/test_delivery_integration.py
    environment:
      PYTHONPATH: /app
      PRIMARY_DATABASE_URL: postgresql://service_request_test:${AI_AUTOMATION_DELIVERY_PRIMARY_DB_PASSWORD}@primary-database:5432/ai_service_request_test
      SERVICE_DESK_SANDBOX_DATABASE_URL: postgresql://service_desk_sandbox_test:${AI_AUTOMATION_DELIVERY_SANDBOX_DB_PASSWORD}@sandbox-database:5432/service_desk_sandbox_test
      SERVICE_DESK_SANDBOX_URL: http://sandbox:8000
      SERVICE_DESK_SANDBOX_TOKEN: ${AI_AUTOMATION_DELIVERY_SANDBOX_TOKEN:?The delivery runner must provide a temporary service token}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./application/tests/test_delivery_integration.py:/checks/test_delivery_integration.py:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
